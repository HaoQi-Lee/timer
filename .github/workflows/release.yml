name: 构建发布

# 两种触发方式：
# 1. 手动：GitHub 仓库 Actions 页面点 "Run workflow"，构建产物在该次运行的 Artifacts 里下载
# 2. 打标签：git tag v1.0.0 && git push origin v1.0.0，自动构建并发布到 Releases
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: work-timer-windows-amd64
          - os: macos-latest
            # universal 二进制同时包含 Intel 和 Apple 芯片
            platform: darwin/universal
            artifact: work-timer-macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: 跑测试
        run: go test ./...

      - name: 构建
        run: wails build -platform ${{ matrix.platform }}

      - name: 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/work-timer.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: 打包 (macOS)
        if: runner.os == 'macOS'
        run: |
          # ad-hoc 签名：arm64 要求二进制至少有本地签名才能运行
          codesign --force --deep -s - build/bin/work-timer.app
          # ditto 保留 .app 包结构和可执行权限
          ditto -c -k --keepParent build/bin/work-timer.app ${{ matrix.artifact }}.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          generate_release_notes: true
          body: |
            ## 下载

            | 文件 | 平台 |
            |---|---|
            | work-timer-windows-amd64.zip | Windows（解压后双击 work-timer.exe） |
            | work-timer-macos-universal.zip | macOS（Intel / Apple 芯片通用） |

            ## macOS 首次运行

            应用未做开发者证书签名，首次打开若提示"无法验证"或"已损坏"：
            在终端执行 `xattr -cr /Applications/work-timer.app`，或右键应用选"打开"。
